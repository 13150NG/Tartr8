<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — TARTR8</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07080a">
  <script src="/js/theme.js"></script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"></noscript>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/css/sections.css">
  <style>
    .not-found { min-height: calc(100vh - var(--header-height)); display: grid; place-items: center; text-align: center; padding: 40px var(--gutter); }
    .not-found .code { font-family: var(--font-display); font-size: clamp(90px, 22vw, 200px); line-height: 1; color: transparent; -webkit-text-stroke: 2px var(--accent); }
    .not-found p { color: var(--muted); max-width: 420px; margin: 0 auto 28px; }
    .not-found .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="TARTR8 Cyberhub home"><img src="/assets/tartr8-logo.png" alt="TARTR8 Cyberhub" width="760" height="257"></a>
    <div class="header-actions">
      <button class="theme-toggle" type="button" aria-label="Switch to light mode"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <a class="header-play" href="/store">Store <span aria-hidden="true">↗</span></a>
    </div>
  </header>
  <main class="not-found">
    <div>
      <div class="code" aria-hidden="true">404</div>
      <h1>Game over — page not found.</h1>
      <p>The page you're looking for doesn't exist or has moved. Press start on something else.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Back to home <span aria-hidden="true">→</span></a>
        <a class="btn btn-ghost" href="/#games">Play a game</a>
      </div>
    </div>
  </main>
</body>
</html>
