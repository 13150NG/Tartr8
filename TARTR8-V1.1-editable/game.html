<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Friendly Catch Game</title>
    <style>
        /* Disable scrolling and bounce effects on mobile */
        html, body {
            position: fixed;
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #222;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none; /* Prevents default zooming and scrolling */
        }
        
        /* Game window adjusts automatically to smaller screens */
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 500px;
            background: #333;
            border: 4px solid #fff;
            border-radius: 8px;
            overflow: hidden;
            box-sizing: border-box;
        }
        
        #basket {
            position: absolute;
            bottom: 20px;
            left: 175px;
            width: 60px; /* Slightly wider for easier mobile play */
            height: 20px;
            background: #00ffcc;
            border-radius: 4px;
        }
        
        .item {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ff4444;
            border-radius: 50%;
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 18px;
            font-weight: bold;
            pointer-events: none; /* Allows touches to pass through UI text */
        }
        
        #gameOverScreen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        button {
            padding: 12px 24px;
            font-size: 18px;
            background: #00ffcc;
            color: #222;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="ui">Score: <span id="score">0</span> | Lives: <span id="lives">3</span></div>
    <div id="basket"></div>
    <div id="gameOverScreen">
        <h2>Game Over!</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button onclick="resetGame()">Play Again</button>
    </div>
</div>

<script>
    const container = document.getElementById('gameContainer');
    const basket = document.getElementById('basket');
    const scoreDisplay = document.getElementById('score');
    const livesDisplay = document.getElementById('lives');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreDisplay = document.getElementById('finalScore');

    let score = 0;
    let lives = 3;
    let basketX = 170;
    const basketWidth = 60;
    
    // Dynamic boundaries based on actual bounding box size
    let containerWidth = container.clientWidth;
    let containerHeight = container.clientHeight;
    
    let items = [];
    let gameInterval;
    let spawnCounter = 0;
    let isGameOver = false;

    // Recalculate dimensions if screen orientation changes
    window.addEventListener('resize', () => {
        containerWidth = container.clientWidth;
        containerHeight = container.clientHeight;
    });

    // Core movement physics logic shared by touch and mouse
    function moveBasket(clientX) {
        if (isGameOver) return;
        const rect = container.getBoundingClientRect();
        
        // Centering basket on point of interaction
        basketX = clientX - rect.left - (basketWidth / 2);
        
        // Boundaries restriction
        if (basketX < 0) basketX = 0;
        if (basketX > containerWidth - basketWidth) basketX = containerWidth - basketWidth;
        
        basket.style.left = basketX + 'px';
    }

    // 1. Desktop Controls
    container.addEventListener('mousemove', (e) => {
        moveBasket(e.clientX);
    });

    // 2. Mobile Smartphone Controls
    container.addEventListener('touchstart', (e) => {
        moveBasket(e.touches[0].clientX);
    }, { passive: true });

    container.addEventListener('touchmove', (e) => {
        e.preventDefault(); // Inhibits whole-page scrolling while moving finger
        moveBasket(e.touches[0].clientX);
    }, { passive: false });

    function spawnItem() {
        const item = document.createElement('div');
        item.classList.add('item');
        item.style.left = Math.floor(Math.random() * (containerWidth - 20)) + 'px';
        item.style.top = '0px';
        container.appendChild(item);
        
        items.push({
            element: item,
            y: 0,
            x: parseInt(item.style.left),
            speed: 3 + Math.random() * 3
        });
    }

    function gameLoop() {
        if (isGameOver) return;

        spawnCounter++;
        if (spawnCounter % 40 === 0) {
            spawnItem();
        }

        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i];
            item.y += item.speed;
            item.element.style.top = item.y + 'px';

            // Basket collision logic
            if (item.y >= containerHeight - 40 && item.y <= containerHeight - 20) {
                if (item.x + 20 >= basketX && item.x <= basketX + basketWidth) {
                    score++;
                    scoreDisplay.innerText = score;
                    item.element.remove();
                    items.splice(i, 1);
                    continue;
                }
            }

            // Floor drop logic
            if (item.y > containerHeight) {
                lives--;
                livesDisplay.innerText = lives;
                item.element.remove();
                items.splice(i, 1);

                if (lives <= 0) {
                    endGame();
                }
            }
        }

        gameInterval = requestAnimationFrame(gameLoop);
    }

    function endGame() {
        isGameOver = true;
        cancelAnimationFrame(gameInterval);
        finalScoreDisplay.innerText = score;
        gameOverScreen.style.display = 'flex';
    }

    function resetGame() {
        items.forEach(item => item.element.remove());
        items = [];
        score = 0;
        lives = 3;
        isGameOver = false;
        scoreDisplay.innerText = score;
        livesDisplay.innerText = lives;
        gameOverScreen.style.display = 'none';
        gameLoop();
    }

    // Launch game
    gameLoop();
</script>

</body>
</html>
