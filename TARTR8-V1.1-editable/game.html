  <style>
    /* Lock the page so touch-dragging the basket never scrolls or zooms. */
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { display: flex; flex-direction: column; }
    .site-header { position: relative; }

    .catch-page {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
      gap: 12px;
    }

    .hud { width: min(440px, 100%); display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .12em; color: var(--muted); }
    .hud strong { display: block; color: #fff; font-size: 22px; letter-spacing: 0; }
    .hud .lives strong { color: var(--accent); letter-spacing: .1em; }

    #gameContainer {
      position: relative;
      width: min(440px, 100%);
      flex: 1;
      max-height: 620px;
      background:
        linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 40px 40px,
        linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 40px 40px,
        var(--panel);
      border: 1px solid var(--line-strong);
      overflow: hidden;
      touch-action: none;
      cursor: none;
    }

    #basket {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 70px;
      height: 14px;
      background: var(--accent);
      box-shadow: 0 0 24px #e77b0088;
      will-change: transform;
    }

    .item {
      position: absolute;
      top: 0;
      left: 0;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--text);
      box-shadow: 0 0 12px #ffffff55;
      will-change: transform;
    }
    .item.bonus { background: var(--accent-soft); box-shadow: 0 0 16px var(--accent-soft); }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(7, 8, 10, .86);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      z-index: 10;
      cursor: default;
    }
    .overlay[hidden] { display: none; }
    .overlay h1 { font-size: clamp(40px, 12vw, 64px); margin: 14px 0 8px; }
    .overlay p { color: var(--muted); font-size: 14px; max-width: 280px; margin: 0 0 22px; }
    .overlay .final { font-family: var(--font-display); font-size: 48px; color: #fff; margin: 0; }

    .btn-primary {
      background: var(--accent);
      color: var(--on-accent);
      border: 0;
      padding: 14px 26px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .btn-primary:hover { background: var(--accent-soft); color: #111; }

    .hint { font-size: 11px; color: #7a838d; letter-spacing: .1em; }
    /* Reserve the player badge's space before it loads, so the game box doesn't jump. */
    .catch-page > .player-tag { min-height: 36px; }
    .catch-page > .player-tag[hidden] { display: inline-flex !important; visibility: hidden; }

    @media (max-width: 800px) {

      .brand img { height: 38px; width: auto; }
      .account-name { display: none; }
      .account-btn.signed-in { padding-right: 5px; }

    @media (max-width: 380px) {

      .header-play { padding: 10px 11px; }
    }
    /* Landscape phones: give the play area as much height as possible. */

      .hud strong { font-size: 18px; }
      .overlay h1 { font-size: 34px; margin: 4px 0; }
      .overlay p { margin-bottom: 10px; }
    }
    @media (pointer: coarse) {

<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="TARTR8 Cyberhub home">
      <img src="assets/tartr8-logo.png" alt="TARTR8 Cyberhub" width="760" height="257">
    </a>
    <div class="header-actions">
      <div class="account"><button class="account-btn" hidden>Sign in</button></div>
      <a class="header-play" href="/#games">← All games</a>
    </div>
  </header>

  <main class="catch-page">
    <div class="player-tag" hidden></div>
    <div class="hud" aria-live="polite">
      <div>SCORE<strong id="score">0</strong></div>
      <div>BEST<strong id="best">0</strong></div>
      <div class="lives">LIVES<strong id="lives">●●●</strong></div>
    </div>

    <div id="gameContainer">
      <div id="basket"></div>

      <div class="overlay" id="startScreen">
        <div class="eyebrow"><span></span> TARTR8 GAME LAB · 04</div>
        <h1>Catch</h1>
        <p>Move the basket with your mouse, finger or arrow keys. Miss three and it's over. It gets faster.</p>
        <button class="btn-primary" id="startBtn">Start game</button>
      </div>

      <div class="overlay" id="gameOverScreen" hidden>
        <div class="eyebrow"><span></span> GAME OVER</div>
        <p class="final" id="finalScore">0</p>
        <p id="finalNote">points</p>
        <button class="btn-primary" id="againBtn">Play again</button>
        <div id="submitSlot"></div>
      </div>
    </div>

    <div class="hint">← → OR DRAG TO MOVE · SPACE TO START</div>
  </main>

<script src="js/api.js"></script>
<script>
  const container = document.getElementById('gameContainer');
  const basket = document.getElementById('basket');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const livesEl = document.getElementById('lives');
  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');

  const ITEM = 18, BASKET_W = 70, BASKET_BOTTOM = 20, BASKET_H = 14, MAX_LIVES = 3;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };

  let width = 0, height = 0, basketX = 0, targetX = null;
  let score = 0, lives = MAX_LIVES, best = Number(store.get('tartr8Catch') || 0);
  let items = [], running = false, lastTime = 0, spawnTimer = 0, elapsed = 0, frame;
  const keys = { left: false, right: false };
  bestEl.textContent = best;

  function measure() {
    width = container.clientWidth;
    height = container.clientHeight;
    basketX = Math.min(Math.max(basketX, 0), width - BASKET_W);
    drawBasket();
  }
  function drawBasket() { basket.style.transform = `translateX(${basketX}px)`; }

  function pointerTo(clientX) {
    const rect = container.getBoundingClientRect();
    targetX = clientX - rect.left - BASKET_W / 2;
  }
  container.addEventListener('pointermove', e => pointerTo(e.clientX));
  container.addEventListener('pointerdown', e => pointerTo(e.clientX));

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') { keys.left = true; targetX = null; }
    if (e.key === 'ArrowRight') { keys.right = true; targetX = null; }
    if (e.target.closest('form') || document.querySelector('.auth-modal')) return; // typing in the sign-in dialog
    if ((e.key === ' ' || e.key === 'Enter') && !running) { e.preventDefault(); start(); }
  });
  document.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft') keys.left = false;
    if (e.key === 'ArrowRight') keys.right = false;
  });
  window.addEventListener('resize', measure);

  function renderLives() { livesEl.textContent = '●'.repeat(lives) + '○'.repeat(MAX_LIVES - lives); }

  function spawn() {
    const el = document.createElement('div');
    const bonus = Math.random() < .12;
    el.className = 'item' + (bonus ? ' bonus' : '');
    container.appendChild(el);
    // Speed is in px per second and ramps up over time.
    items.push({ el, bonus, x: Math.random() * (width - ITEM), y: -ITEM, speed: 170 + Math.random() * 120 + elapsed * 6 });
  }

  function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, .05);
    lastTime = now;
    elapsed += dt;

    if (targetX !== null) basketX += (targetX - basketX) * Math.min(1, dt * 18);
    if (keys.left) basketX -= 420 * dt;
    if (keys.right) basketX += 420 * dt;
    basketX = Math.min(Math.max(basketX, 0), width - BASKET_W);
    drawBasket();

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawn();
      spawnTimer = Math.max(.35, .9 - elapsed * .012);
    }

    const catchTop = height - BASKET_BOTTOM - BASKET_H - ITEM;
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      const prevY = it.y;
      it.y += it.speed * dt;
      it.el.style.transform = `translate(${it.x}px, ${it.y}px)`;

      // Caught if the item crossed the basket's top edge this frame while overlapping it horizontally.
      if (prevY <= catchTop && it.y >= catchTop && it.x + ITEM >= basketX && it.x <= basketX + BASKET_W) {
        score += it.bonus ? 3 : 1;
        scoreEl.textContent = score;
        it.el.remove();
        items.splice(i, 1);
      } else if (it.y > height) {
        it.el.remove();
        items.splice(i, 1);
        if (!it.bonus) {
          lives--;
          renderLives();
          if (lives <= 0) return end();
        }
      }
    }
    frame = requestAnimationFrame(loop);
  }

  function start() {
    if (running) return;
    items.forEach(it => it.el.remove());
    items = [];
    score = 0; lives = MAX_LIVES; elapsed = 0; spawnTimer = .4;
    scoreEl.textContent = 0;
    renderLives();
    startScreen.hidden = true;
    gameOverScreen.hidden = true;
    document.getElementById('submitSlot').innerHTML = '';
    measure();
    running = true;
    lastTime = performance.now();
    frame = requestAnimationFrame(loop);
  }

  function end() {
    running = false;
    cancelAnimationFrame(frame);
    document.getElementById('finalScore').textContent = score;
    if (score > best) {
      best = score;
      store.set('tartr8Catch', best);
      bestEl.textContent = best;
      document.getElementById('finalNote').textContent = 'points — new personal best!';
    } else {
      document.getElementById('finalNote').textContent = `points · best ${best}`;
    }
    gameOverScreen.hidden = false;
    document.getElementById('againBtn').focus();
    offerScoreSubmit(document.getElementById('submitSlot'), 'catch', score);
  }

  document.getElementById('startBtn').onclick = start;
  document.getElementById('againBtn').onclick = start;

  measure();
  basketX = (width - BASKET_W) / 2;
  drawBasket();
</script>
</body>
